[project]
name = "omvida-backend"
version = "0.1.0"
description = "Omvida's wiki service: the study wiki's index, pages rendered for Qt, search and session logs"
requires-python = ">=3.11"
dependencies = [
    "markdown-it-py>=3.0",
    "mdit-py-plugins>=0.4",
    "pygments>=2.18",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff>=0.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/omvida_backend"]

[tool.pytest.ini_options]
testpaths = ["tests/py"]
pythonpath = ["backend"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]
